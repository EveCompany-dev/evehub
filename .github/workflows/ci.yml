name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real services, so migrations and any future integration test run against
    # the same engines production uses.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
          POSTGRES_DB: evehub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eve -d evehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eve:eve@localhost:5432/evehub?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-not-used-in-production
      # Deterministic 32-byte key: CI never touches real credentials.
      CREDENTIALS_KEY: Y2ktb25seS1rZXktbm90LWEtcmVhbC1zZWNyZXQtMzI=
      CREDENTIALS_KEY_VERSION: '1'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed, so everything that
      # typechecks against it needs this first.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate schema
        run: pnpm exec prisma validate

      - name: Apply migrations
        run: pnpm db:deploy

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build
        run: pnpm --filter @eve/web build

  # The production images and the compose file, built and checked, never pushed.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Compose refuses to run without its passwords
        run: |
          cp .env.example .env
          for missing in POSTGRES_PASSWORD POSTGRES_APP_PASSWORD REDIS_PASSWORD; do
            set_vars=""
            for var in POSTGRES_PASSWORD POSTGRES_APP_PASSWORD REDIS_PASSWORD; do
              [ "$var" = "$missing" ] || set_vars="$set_vars $var=ci"
            done
            if env $set_vars docker compose --profile full config -q 2>/dev/null; then
              echo "docker compose accepted a config without $missing"
              exit 1
            fi
          done
          POSTGRES_PASSWORD=ci POSTGRES_APP_PASSWORD=ci REDIS_PASSWORD=ci docker compose --profile full config -q

      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t evehub-web:ci .

      - name: Build worker image
        run: docker build -f infra/Dockerfile.worker -t evehub-worker:ci .
