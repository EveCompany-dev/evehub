name: evehub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: evehub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eve -d evehub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # `web` e `worker` ficam atras do profile `full`. No dia a dia rode-os
  # nativamente (`pnpm dev`): o file-watching do Next dentro de container no
  # Windows e lento. Use `pnpm stack:up` para subir tudo como em producao.
  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eve:eve@postgres:5432/evehub?schema=public
      REDIS_URL: redis://redis:6379
      # Shared with worker below — both need to reach the same files (worker
      # deletes old scheduled-post media once it's safely past its retention
      # window; see apps/worker/src/media-cleanup.ts). Bounded, not
      # unbounded: that cleanup job is what keeps this from growing forever.
      UPLOADS_DIR: /data/uploads
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ['full']
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eve:eve@postgres:5432/evehub?schema=public
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads_data:
