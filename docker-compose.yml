name: evehub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eve
      # Overridable, but the default stays `eve`: Postgres bakes the password
      # into the data directory at initdb, so changing it here would lock the
      # app out of an existing pgdata volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve}
      POSTGRES_DB: evehub
    ports:
      # Bound to loopback ON PURPOSE. `- '5432:5432'` publishes on every
      # interface, so with these dev credentials anyone who can reach this
      # machine on the network reads and writes the whole database, bypassing
      # every check in the app. This host holds CREDENTIALS_KEY, AUTH_SECRET
      # and the clients' ad tokens (see scripts/remote-access/REMOTE-ACCESS.md),
      # so it is not a machine to leave a trivially-authenticated Postgres open
      # on. Reach it from another machine over the Tailscale/SSH tunnel, not by
      # republishing this port.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eve -d evehub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Loopback only, same reasoning as Postgres above — and more pressing
      # here, because this Redis has no password at all: it holds login
      # rate-limit counters, chat history and the SSE pub/sub.
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # `web` e `worker` ficam atras do profile `full`. No dia a dia rode-os
  # nativamente (`pnpm dev`): o file-watching do Next dentro de container no
  # Windows e lento. Use `pnpm stack:up` para subir tudo como em producao.
  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eve:eve@postgres:5432/evehub?schema=public
      REDIS_URL: redis://redis:6379
      # Shared with worker below — both need to reach the same files (worker
      # deletes old scheduled-post media once it's safely past its retention
      # window; see apps/worker/src/media-cleanup.ts). Bounded, not
      # unbounded: that cleanup job is what keeps this from growing forever.
      UPLOADS_DIR: /data/uploads
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ['full']
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eve:eve@postgres:5432/evehub?schema=public
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads_data:
